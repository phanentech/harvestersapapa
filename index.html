<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<meta name="theme-color" content="#151B3B">
<title>Church Launch System</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F9;--card:#fff;--ink:#161B33;--mut:#666D88;--line:#E1E4EF;--navy:#151B3B;--before:#4457D6;--during:#0E9F85;--after:#D9822B;--good:#0E8A5F;--warn:#A86B0C;--bad:#C93B3B;--gb:#E3F5EE;--wb:#FBF0DB;--bb:#FBE4E4}
@media(prefers-color-scheme:dark){:root{--bg:#0E1122;--card:#181C33;--ink:#EEF0FA;--mut:#9AA2C2;--line:#2A2F4D;--navy:#0A0D1C;--before:#7C8CFF;--during:#2CC5A5;--after:#F0A24E;--good:#4BD6A0;--warn:#F0B95A;--bad:#FF8080;--gb:#12332A;--wb:#3A2D12;--bb:#401C1F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
#top h1{margin:0;font-size:1.05rem;font-weight:700;line-height:1.2}
#top small{display:block;opacity:.7;font-size:.8rem}
#top .grow{flex:1;min-width:0}
#back{display:none;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;height:40px;padding:0 12px;font-weight:600}
#pill{background:#fff;color:var(--navy);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
#app{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
#nav{display:none}
main{padding:16px;padding-bottom:calc(150px + env(safe-area-inset-bottom));min-width:0}
h2{font-size:1.15rem;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:4px}
h2 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px;min-height:98px}
.tile .v{font-size:1.5rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tile .l{font-weight:600;font-size:.9rem;margin-top:2px}
.tile .s{color:var(--mut);font-size:.8rem}
.tile.sk{background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.meter{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);transition:width .5s}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.chip{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;font-weight:600}
.chip span{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
.chip:active,.card:active{transform:scale(.985)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{margin:0;flex:1}
.icon{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:1.1rem}
.icon.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin-bottom:12px}
.list{display:grid;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.pend{opacity:.6}
.r1{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.r1 b{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mut);font-size:.85rem;margin-top:4px}
.meta i{font-style:normal;opacity:.75;margin-right:4px}
.badge{flex:none;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--line);color:var(--mut);white-space:nowrap}
.badge.good{background:var(--gb);color:var(--good)}.badge.warn{background:var(--wb);color:var(--warn)}.badge.bad{background:var(--bb);color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));height:54px;padding:0 22px;border:0;border-radius:99px;background:var(--c,var(--before));color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.28)}
dialog{border:0;padding:0;color:var(--ink);background:var(--card);width:100%;max-width:none;max-height:92vh;margin:auto 0 0;border-radius:20px 20px 0 0}
dialog::backdrop{background:rgba(10,13,28,.55)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh b{font-size:1.05rem}
.db{padding:16px;overflow:auto;display:grid;grid-template-columns:1fr;gap:14px;-webkit-overflow-scrolling:touch}
.df{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
label em{color:var(--bad);font-style:normal}
input,select,textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:9px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--c,var(--before));outline-offset:1px}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.money span{padding-left:12px;color:var(--mut)}.money input{border:0;background:none;outline:0}
.calc{min-height:46px;border-radius:10px;background:var(--line);padding:11px 12px;font-weight:700}
.btn{flex:1;min-height:48px;border-radius:12px;border:0;font-weight:700;background:var(--c,var(--before));color:#fff}
.btn.ghost{flex:none;background:none;border:1px solid var(--line);color:var(--ink);padding:0 18px}
.btn.del{flex:none;background:none;border:1px solid var(--bad);color:var(--bad);padding:0 16px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;z-index:20;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--bad)}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.74rem;font-weight:600;color:var(--mut)}
#tabs button span{font-size:1.3rem;line-height:1.2}
#tabs button.on{color:var(--c);box-shadow:inset 0 3px 0 var(--c)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;margin:14px 0 12px}
.seg button{border:0;background:none;border-radius:10px;min-height:40px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.charts{display:grid;gap:12px;grid-template-columns:1fr;margin-top:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.chart h3{margin:0 0 10px;font-size:.95rem}
.br{margin:9px 0}.br .t{display:flex;justify-content:space-between;gap:10px;font-size:.85rem}.br .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .t b{font-weight:600;white-space:nowrap}
.bt{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}.bt i{display:block;height:100%;background:var(--c);border-radius:9px}
.dn{display:flex;align-items:center;gap:16px}
.ring{width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring b{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.15rem}
.lg{flex:1;min-width:0;font-size:.85rem}.lg div{display:flex;align-items:center;gap:7px;margin:4px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nod{color:var(--mut);font-size:.9rem;padding:8px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.box .meter{margin:8px 0 2px}
.sec{margin:22px 0 10px;font-size:1.05rem}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv b{text-align:right}
.rep textarea{min-height:110px;margin-bottom:6px}
.rep .btn{flex:none;min-height:40px;padding:0 18px;margin-bottom:12px}
.hd{margin:0 0 4px;font-size:1.3rem}
@media print{#top,#tabs,#nav,.fab,.noprint,#toast{display:none!important}body{background:#fff;color:#000}#app{display:block}main{padding:0}.tile,.box,.chart{break-inside:avoid}.rep textarea{border:0;resize:none;padding:0}}
@media(min-width:600px){.charts{grid-template-columns:1fr 1fr}.kp{grid-template-columns:repeat(4,1fr)!important}.tiles{grid-template-columns:repeat(3,1fr)}.chips{grid-template-columns:repeat(3,1fr)}.db{grid-template-columns:1fr 1fr}.db .wide{grid-column:1/-1}}
@media(min-width:900px){
 #app{grid-template-columns:240px 1fr}
 #nav{display:block;position:sticky;top:64px;align-self:start;padding:16px 8px 16px 16px;height:calc(100vh - 64px);overflow:auto}
 #nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:10px;text-align:left;font-weight:500}
 #nav button:hover{background:var(--line)}#nav button.on{background:var(--card);font-weight:700;box-shadow:inset 3px 0 0 var(--c)}
 #nav h4{margin:14px 12px 4px;font-size:.85rem;color:var(--mut);font-weight:600}
 .tiles{grid-template-columns:repeat(3,1fr)}.chips{display:none}
 dialog{max-width:680px;margin:auto;border-radius:18px;max-height:88vh}
 .fab{right:32px;bottom:28px}#tabs{display:none}main{padding-bottom:96px}#toast{bottom:28px}
}
@media(min-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:899px){body.in #back{display:block}}
.kp{grid-template-columns:repeat(2,1fr)}
body.auth #tabs,body.auth #nav,body.auth #pill,body.auth #me,body.auth #back{display:none!important}
body.auth #app{display:block}body.auth main{padding-bottom:40px}
.login{max-width:420px;margin:20px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px 22px;box-shadow:0 20px 50px rgba(21,27,59,.14)}
.lg-hero{width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,var(--before),var(--navy));display:grid;place-items:center;font-size:2.1rem;margin:0 auto 16px}
.login h1{margin:0 0 4px;text-align:center;font-size:1.55rem}.login .lead{text-align:center;color:var(--mut);margin:0 0 18px}
.login label{margin-top:12px}
.pwrow{display:flex;gap:8px}.pwrow button{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.1rem}
.lerr{color:var(--bad);font-weight:600;min-height:1.5em;margin:12px 0 4px;text-align:center;font-size:.92rem}.lerr.ok{color:var(--good)}
.login .btn{width:100%;margin-top:6px;flex:none}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--before);font-weight:600;padding:8px}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:var(--before);color:#fff;font-weight:700;flex:none}
.me{display:flex;gap:14px;align-items:center;margin-bottom:6px}.me .avatar{width:54px;height:54px;font-size:1.2rem;border-color:var(--line)}
.hint{color:var(--mut);font-size:.82rem;margin-top:4px}
.tools{display:grid;gap:10px;grid-template-columns:1fr}.tools .btn{flex:none;min-height:46px;background:var(--navy)}
@media(min-width:600px){.tools{grid-template-columns:repeat(3,1fr)}}
.seg.s4{grid-template-columns:repeat(4,1fr)}.seg.s4 button{font-size:.88rem;padding:0 4px}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 4px}
.preset{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;padding:0;text-align:center}
.preset span{display:block;height:36px}.preset em{grid-column:1/-1;font-style:normal;font-weight:600;font-size:.82rem;padding:7px 4px}
.preset:active{transform:scale(.97)}
.cols{display:grid;gap:14px;margin:14px 0}.colr{display:flex;align-items:center;gap:14px;margin:0}.colr input{width:56px;height:56px;min-height:56px;padding:3px;flex:none;cursor:pointer}
.colr span{font-weight:600}.colr small{display:block;color:var(--mut);font-weight:500;font-family:Consolas,Menlo,monospace}
.mx{display:grid;gap:8px;margin-top:10px}.mxr{display:flex;align-items:center;gap:10px;justify-content:space-between}.mxr span{min-width:0}.mxr select{width:140px;flex:none;min-height:42px}
.mxh{font-size:.8rem;font-weight:700;color:var(--mut);margin:12px 0 0}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.sgrid{display:grid;gap:14px;grid-template-columns:1fr}.sgrid .box{margin:0}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
@media(min-width:600px){.presets{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <button id="back" aria-label="Back to home">‹ Home</button>
  <div class="grow"><h1 id="ttl">Church Launch</h1><small id="sub"></small></div>
  <div id="pill" hidden></div>
  <button id="me" class="avatar" hidden aria-label="My account"></button>
</header>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<nav id="tabs">
  <button data-go="home" style="--c:var(--ink)"><span>🏠</span>Home</button>
  <button data-go="phase:Before" style="--c:var(--before)"><span>📋</span>Before</button>
  <button data-go="phase:During" style="--c:var(--during)"><span>🎯</span>During</button>
  <button data-go="phase:After" style="--c:var(--after)"><span>📊</span>After</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
// ─── BACKEND URL CONFIG ───────────────────────────────────────────────────
// Served by Google Apps Script (the normal way)? Leave BACKEND_URL empty: the page talks to the backend directly.
// Hosting this file somewhere else (Vercel, Netlify, GitHub Pages, your own server)? Deploy the Apps Script as a
// Web App ("Anyone" can access) and paste its full /exec address below, for example:
//   const BACKEND_URL = 'https://script.google.com/macros/s/AKfycb.../exec';

const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxap3RhSfWXXt_KbinNoc0tEE4v_O76EwQ9TFLmy6uFB62np4J0exbOXUBA0ljKmXK6/exec';   // ← paste your GAS /exec URL here (leave empty when deployed in GAS)

// Optional: if you ALSO host Forms.html elsewhere, put its address here so the "Share forms" links use it.
// Leave empty to use the Apps Script link (…/exec?page=feedback).
const FORMS_URL = '';

// ─── APP STATE ────────────────────────────────────────────────────────────
const APP = { backendUrl: BACKEND_URL.trim(), inGas: typeof google !== 'undefined' && !!(google.script && google.script.run) };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = ''; try { TOKEN = localStorage.getItem('cl_tok') || ''; } catch (e) {}
const saveTok = t => { TOKEN = t || ''; try { t ? localStorage.setItem('cl_tok', t) : localStorage.removeItem('cl_tok'); } catch (e) {} };
// One door to the backend. Inside Google it uses google.script.run; anywhere else it posts to BACKEND_URL.
async function rpc(fn, args) {
  if (APP.inGas) return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
  if (!APP.backendUrl) throw new Error('BACKEND_NOT_SET');
  let res;
  try {   // text/plain keeps this a "simple" request, so the browser needs no CORS pre-flight with Apps Script
    res = await fetch(APP.backendUrl, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args}), redirect: 'follow'});
  } catch (e) { throw new Error('Could not reach the server. Check your internet connection.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The server sent an unexpected reply. Check that BACKEND_URL is your Web App /exec link and that access is set to “Anyone”.'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j.data;
}
const api = (fn, ...a) => rpc(fn, [TOKEN, ...a]).catch(e => {
  const m = (e && e.message) || '';
  if (/AUTH_REQUIRED/.test(m)) signedOut(TOKEN ? 'Your session has ended. Please sign in again.' : '');
  else if (/PW_CHANGE/.test(m)) showChange(true);
  throw e;
});
const pub = (fn, ...a) => rpc(fn, a);
function showSetup() {
  document.body.classList.add('auth');
  $('#main').innerHTML = `<div class="login" style="max-width:520px"><div class="lg-hero">🔌</div><h1>Connect the backend</h1><p class="lead">This page is hosted outside Google Apps Script, so it needs your Web App link.</p>
    <div class="hint" style="line-height:1.8;font-size:.92rem">1. In Apps Script open <b>Deploy → Manage deployments</b> and copy the <b>Web app URL</b> (it ends in <code>/exec</code>).<br>
    2. Open this file (<code>Index.html</code>) and paste it into <code>const BACKEND_URL = '';</code> at the top of the script.<br>
    3. Save the file and publish it again. Make sure the Web App is set to run as <b>Me</b> with access for <b>Anyone</b>.</div></div>`;
}
let EMOJI = '⛪';
const DEF_THEME = {navy: '#151B3B', before: '#4457D6', during: '#0E9F85', after: '#D9822B'};
const hx = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
const mixHex = (a, b, t) => { const x = hx(a), y = hx(b); return '#' + x.map((v, i) => ('0' + Math.round(v + (y[i] - v) * t).toString(16)).slice(-2)).join(''); };
const lum = c => { const x = hx(c); return (0.299 * x[0] + 0.587 * x[1] + 0.114 * x[2]) / 255; };
function applyTheme(t) {                       // the admin's colours, for everyone (dark mode gets matching shades)
  t = Object.assign({}, DEF_THEME, t || {});
  const L = c => mixHex(c, '#ffffff', .3), D = c => mixHex(c, '#000000', .4);
  let el = document.getElementById('theme');
  if (!el) { el = document.createElement('style'); el.id = 'theme'; document.head.appendChild(el); }
  el.textContent = `:root{--navy:${t.navy};--before:${t.before};--during:${t.during};--after:${t.after}}@media(prefers-color-scheme:dark){:root{--navy:${D(t.navy)};--before:${L(t.before)};--during:${L(t.during)};--after:${L(t.after)}}}`;
  PAL[0] = t.before; PAL[1] = t.during; PAL[2] = t.after;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t.navy;
}
async function loadPublic() {
  try { const p = await pub('getPublicInfo'); applyTheme(p.theme); EMOJI = p.emoji || '⛪'; } catch (e) {}
}
const errText = e => String((e && e.message) || 'Something went wrong. Please try again.').replace(/^Error: /, '');

function authShell(inner) {
  S.boot = null; document.body.classList.add('auth'); document.body.classList.remove('in');
  $('#ttl').textContent = 'Church Launch'; $('#sub').textContent = '';
  $('#main').innerHTML = `<div class="login"><div class="lg-hero">${EMOJI}</div>${inner}</div>`;
}
function signedOut(msg) {
  saveTok(''); S.user = null; S.data = {}; S.dash = null; S.rep = null; S.my = null; S.links = null; S.ulist = null;
  showLogin(msg);
}
function showLogin(msg, email) {
  authShell(`<h1>Welcome back</h1><p class="lead">Sign in to the church launch system.</p>
    <label for="em">Email</label><input id="em" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" value="${esc(email || '')}">
    <label for="pw">Password</label><div class="pwrow"><input id="pw" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" id="eye" aria-label="Show password">👁</button></div>
    <div class="lerr" id="lerr" role="alert">${esc(msg || '')}</div>
    <button class="btn" id="lgo">Sign in</button><button class="link" id="forgot" type="button">Forgot your password?</button>`);

/* ---------- list ---------- */
function renderList() {

  h += '<div class="tiles kp">' + (st ? st.k.map(k => tile(k[3] ? 'bad' : c, k[1], k[0], k[2])).join('') : '<div class="tile sk"></div>'.repeat(4)) + '</div>';
  h += `<div class="seg"><button data-sub="list" class="${S.sub === 'list' ? 'on' : ''}">Records</button><button data-sub="charts" class="${S.sub === 'charts' ? 'on' : ''}">Charts</button></div>`;
  if (S.sub === 'charts') {

  } else {

    if (!rows) h += '<div class="list">' + '<div class="tile sk" style="--c:var(--line);min-height:68px"></div>'.repeat(4) + '</div>';

    }
  }

function card(m, r) {

  return `<button class="card ${r._p ? 'pend' : ''}" data-id="${esc(r.id)}"><div class="r1"><b>${esc(r[m.p] || '(untitled)')}</b>${bv ? `<span class="badge ${fl ? 'bad' : tone(bv)}">${esc(bv)}</span>` : ''}</div><div class="meta">${meta}${r._p ? '<span>Saving…</span>' : ''}</div></button>`;

async function load(key, quiet) {

/* ---------- form ---------- */
function fieldHtml(f, v) {
  const req = f.r ? ' required' : '', id = ' name="' + f.k + '"';
  let inp;
  if (f.t === 'select') inp = `<select${id}${req}><option value="">Select…</option>${(S.boot.lists[f.o] || []).map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
  else if (f.t === 'long') inp = `<textarea${id}${req}></textarea>`;
  else if (f.t === 'money') inp = `<div class="money"><span>₦</span><input${id}${req} type="number" inputmode="decimal" min="0" step="any"></div>`;
  else if (f.t === 'num') inp = `<input${id}${req} type="number" inputmode="numeric" min="0" step="any">`;
  else if (f.t === 'calc') inp = `<div class="calc" data-calc="${f.k}">–</div>`;
  else if (f.t === 'user') inp = `<select${id}><option value="">Not assigned</option>${(S.boot.people || []).map(p => `<option value="${esc(p.email)}">${esc(p.name)} · ${esc(p.role)}</option>`).join('')}</select>`;

function openForm(m, rec) {
  const isNew = !rec || !rec.id, dlg = $('#dlg'), c = PH[m.phase];
  rec = rec || {};
  dlg.style.setProperty('--c', `var(--${c})`);
  dlg.innerHTML = `<form novalidate><div class="dh"><b>${!m.rw ? 'View' : isNew ? 'Add' : 'Edit'} · ${esc(m.title)}</b><button type="button" class="icon" id="x" aria-label="Close">✕</button></div>
    <div class="db">${m.fields.map(f => fieldHtml(f)).join('')}</div>
    <div class="df">${isNew || !m.rw || !S.perms.del ? '' : '<button type="button" class="btn del" id="del">Delete</button>'}${m.rw ? '<button type="submit" class="btn">Save</button>' : '<button type="button" class="btn ghost" id="x2" style="flex:1">Close</button>'}</div></form>`;
  const form = dlg.querySelector('form');
  m.fields.forEach(f => { const el = form.elements[f.k]; if (!el) return; el.value = rec[f.k] != null ? rec[f.k] : (isNew && f.k === 'date' && f.t === 'date' ? TODAY : isNew && f.k === 'dept' && S.boot.user.role === 'Department head' ? S.boot.user.dept : ''); });
  if (!m.rw) { form.querySelectorAll('input,select,textarea').forEach(el => el.disabled = true); $('#x2').onclick = () => dlg.close(); }
  const get = k => form.elements[k] ? form.elements[k].value : '';
  const refresh = () => m.fields.filter(f => f.c).forEach(f => {
    const v = calc(f.c, get), el = form.querySelector(`[data-calc="${f.k}"]`);
    el.textContent = v === '' ? '–' : show(f, v);
  });
  form.oninput = refresh; refresh();
  form.addEventListener('change', e => { if (e.target.name === 'assignee' && form.elements.person && !form.elements.person.value.trim()) { const p = (S.boot.people || []).find(x => x.email === e.target.value); if (p) form.elements.person.value = p.name; } });
  $('#x').onclick = () => dlg.close();
  if ($('#del')) $('#del').onclick = () => { if (confirm('Delete this record?')) { dlg.close(); remove(m, rec.id); } };
  form.onsubmit = e => {
    e.preventDefault();
    const bad = m.fields.find(f => f.r && !String(get(f.k)).trim());
    if (bad) { form.elements[bad.k].reportValidity ? form.elements[bad.k].reportValidity() : 0; toast('Please fill in: ' + bad.l, 1); return; }
    const out = { id: rec.id || '' };
    m.fields.forEach(f => out[f.k] = f.c ? calc(f.c, get) : get(f.k).trim());

}
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- save / delete (instant UI, syncs in background) ---------- */
async function persist(m, rec) {
  const L = () => S.data[m.key] || (S.data[m.key] = []), isNew = !rec.id;
  const tmp = Object.assign({}, rec, { id: isNew ? 'tmp' + Date.now() : rec.id, _p: 1 });
  const i0 = isNew ? -1 : L().findIndex(r => r.id === rec.id), old = i0 > -1 ? L()[i0] : null;
  if (isNew) L().unshift(tmp); else if (i0 > -1) L()[i0] = tmp;
  renderList();
  try {
    const saved = await api('saveRecord', m.key, rec);
    const i = L().findIndex(r => r.id === tmp.id); if (i > -1) L()[i] = saved;
    S.dash = null; S.rep = null; toast('Saved');
  } catch (e) {
    const i = L().findIndex(r => r.id === tmp.id);
    if (i > -1) { if (isNew) L().splice(i, 1); else L()[i] = old; }
    toast((e && e.message || 'Could not save').replace(/^Error: /, ''), 1);
    if (S.cur === m.key) openForm(m, rec);
  }
  if (S.cur === m.key) renderList();
}
async function remove(m, id) {
  const L = () => S.data[m.key], i0 = L().findIndex(r => r.id === id), old = L()[i0];
  L().splice(i0, 1); renderList();
  try { await api('deleteRecord', m.key, id); S.dash = null; S.rep = null; toast('Deleted'); }
  catch (e) { L().splice(i0, 0, old); renderList(); toast('Could not delete', 1); }
}

  let h = `<div class="bar" style="--c:var(--before)"><h2 style="--c:var(--before)"><i></i>Team & emails <small style="color:var(--mut);font-weight:500">${u ? u.users.length : ''}</small></h2><button class="icon" data-go="settings" aria-label="Settings">⚙️</button><button class="icon" id="rf" aria-label="Refresh">↻</button></div>`;
  if (!u) h += '<div class="tiles kp">' + '<div class="tile sk"></div>'.repeat(3) + '</div>';
  else {
    h += '<div class="tiles kp">' + tile('before', u.users.filter(x => x.active).length, 'Active users', 'can sign in') + tile('after', u.users.filter(x => x.must && x.active).length, 'Awaiting first sign-in', 'still on temporary password') + tile('during', u.quota, 'Emails left today', 'daily sending limit') + '</div>';
    h += `<h3 class="sec">Email tools</h3><div class="tools"><button class="btn" data-mail="reminders">⏰ Send task reminders now</button><button class="btn" data-mail="countdown">⏳ Send countdown email now</button><button class="btn" data-mail="test">✉️ Send me a test email</button></div>
      <p class="hint">Automatic: task reminders go out every morning at 7am, and the launch countdown at key milestones (90, 60, 30, 21, 14, 10, 7, 5, 3, 2, 1 days and launch day).</p><h3 class="sec">People</h3><div class="list">` +
      u.users.map(x => `<button class="card" data-u="${esc(x.email)}"><div class="r1"><b>${esc(x.name)}</b><span class="badge ${!x.active ? 'bad' : x.must ? 'warn' : 'good'}">${!x.active ? 'Inactive' : x.must ? 'Invited' : 'Active'}</span></div>
        <div class="meta"><span><i>Role</i>${esc(x.role)}</span><span>${esc(x.email)}</span>${x.dept ? `<span><i>Dept</i>${esc(x.dept)}</span>` : ''}<span><i>Last sign-in</i>${esc(x.last || 'Never')}</span>${x.ov ? '<span><i>Custom access</i>Yes</span>' : ''}</div></button>`).join('') + '</div>';
  }
  h += '<button class="fab" id="addu" style="--c:var(--before)">+ Add user</button>';
  $('#main').innerHTML = h;
  $('#rf') && ($('#rf').onclick = () => loadUsers());
  $('#addu').onclick = () => openUser();
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => openUser(b.dataset.u));
  document.querySelectorAll('[data-mail]').forEach(b => b.onclick = async () => {
    b.disabled = true; const t = b.textContent; b.textContent = 'Sending…';
    try { const r = await api('emailAction', b.dataset.mail); toast(r.sent + ' email' + (r.sent === 1 ? '' : 's') + ' sent'); loadUsers(true); }
    catch (e) { toast(errText(e), 1); }
    b.disabled = false; b.textContent = t;
  });
}
function openUser(email) {
  const dlg = $('#dlg'), u = email ? S.ulist.users.find(x => x.email === email) : null, roles = S.ulist.roles, isNew = !u;
  dlg.style.setProperty('--c', 'var(--before)');
  const SEL = (opts, attr) => `<select ${attr}><option value="">Same as role</option>${opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
  const ovHtml = `<details class="wide" id="ovd"><summary>Custom access for this person (optional)</summary><p class="hint" style="margin:4px 0 0">Leave everything on “Same as role” unless this person needs more, or less, than their role allows.</p><div class="mx">
    ${S.ulist.modules.map(m => `<div class="mxr"><span>${m.icon} ${esc(m.title)}</span>${SEL([['none', 'No access'], ['view', 'View only'], ['edit', 'Can edit']], 'data-ovm="' + m.key + '"')}</div>`).join('')}
    <div class="mxh">Abilities</div>${[['dash', 'See the dashboard'], ['reports', 'See the reports'], ['del', 'Delete records'], ['scope', 'Only own department'], ['notify', 'Get task alert emails']].map(c => `<div class="mxr"><span>${c[1]}</span>${SEL([['yes', 'Yes'], ['no', 'No']], 'data-ovc="' + c[0] + '"')}</div>`).join('')}</div></details>`;
  dlg.innerHTML = `<form novalidate><div class="dh"><b>${isNew ? 'Add user' : 'Edit user'}</b><button type="button" class="icon" id="x" aria-label="Close">✕</button></div>
    <div class="db"><div class="wide"><label>Full name <em>*</em></label><input name="name" type="text" autocomplete="off"></div>
    <div class="wide"><label>Email (they sign in with this) <em>*</em></label><input name="email" type="email" autocomplete="off" ${isNew ? '' : 'disabled'}></div>
    <div><label>Role <em>*</em></label><select name="role"><option value="">Select…</option>${roles.map(r => `<option>${esc(r.name)}</option>`).join('')}</select></div>
    <div><label>Department</label><select name="dept"><option value="">None</option>${(S.boot.lists.dept || []).map(d => `<option>${esc(d)}</option>`).join('')}</select></div>
    <div class="wide hint" id="rinfo" style="margin:0"></div>${ovHtml}
    ${isNew ? '<div class="wide hint" style="margin:0">A welcome email with a temporary password and sign-in link is sent automatically.</div>' : '<div class="wide"><label>Status</label><select name="active"><option value="Yes">Active</option><option value="No">Inactive (cannot sign in)</option></select></div>'}</div>
    <div class="df">${isNew ? '' : '<button type="button" class="btn ghost" id="rst">Reset password</button>'}<button type="submit" class="btn">${isNew ? 'Add and email invite' : 'Save'}</button></div></form>`;
  const f = dlg.querySelector('form');
  if (u) { f.elements.name.value = u.name; f.elements.email.value = u.email; f.elements.role.value = u.role; f.elements.dept.value = u.dept; f.elements.active.value = u.active ? 'Yes' : 'No'; }
  if (u && u.ov) {
    Object.keys(u.ov.m || {}).forEach(k => { const e = f.querySelector(`[data-ovm="${k}"]`); if (e) e.value = u.ov.m[k]; });
    Object.keys(u.ov.c || {}).forEach(k => { const e = f.querySelector(`[data-ovc="${k}"]`); if (e) e.value = u.ov.c[k] ? 'yes' : 'no'; });
    $('#ovd').open = true;
  }
  const collectOv = () => {
    const ov = {m: {}, c: {}};
    f.querySelectorAll('[data-ovm]').forEach(e => { if (e.value) ov.m[e.dataset.ovm] = e.value; });
    f.querySelectorAll('[data-ovc]').forEach(e => { if (e.value) ov.c[e.dataset.ovc] = e.value === 'yes'; });
    return ov;
  };
  const info = () => { const r = roles.find(x => x.name === f.elements.role.value); $('#rinfo').textContent = r ? r.info : ''; };
  f.elements.role.onchange = info; info();
  $('#x').onclick = () => dlg.close();
  if (!isNew) $('#rst').onclick = async () => {
    if (!confirm('Email ' + u.name + ' a new temporary password?')) return;
    try { const r = await api('resetUserPassword', u.email); dlg.close(); toast(r.emailed ? 'Reset email sent' : 'Email failed'); if (!r.emailed) prompt('The email could not be sent. Share this temporary password with ' + u.name + ':', r.temp); loadUsers(true); }
    catch (e) { toast(errText(e), 1); }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const d = {isNew: isNew, name: f.elements.name.value.trim(), email: (isNew ? f.elements.email.value : u.email).trim(), role: f.elements.role.value, dept: f.elements.dept.value, active: isNew ? true : f.elements.active.value === 'Yes', ov: collectOv()};
    if (!d.name || !d.email || !d.role) return toast('Name, email and role are required', 1);
    if (d.role === 'Department head' && !d.dept) return toast('Choose the department for a department head', 1);
    const b = f.querySelector('[type=submit]'); b.disabled = true;
    try {
      const r = await api('saveUser', d); dlg.close();
      if (isNew) { toast(r.emailed ? 'Invitation emailed to ' + d.email : 'User added. Email could not be sent'); if (!r.emailed) prompt('The email could not be sent. Share this temporary password with ' + d.name + ':', r.temp); }
      else toast('User updated');
      loadUsers(true);
    } catch (er) { b.disabled = false; toast(errText(er), 1); }
  };
  dlg.showModal();
}

/* ---------- global settings (admin) ---------- */
const PRESETS = [['Royal blue', ['#151B3B', '#4457D6', '#0E9F85', '#D9822B']], ['Emerald', ['#0F2D2A', '#0E8F6B', '#3B82F6', '#E0A800']], ['Crimson', ['#2A0F1A', '#C2334D', '#0E9F85', '#D9822B']],
  ['Violet', ['#1F1442', '#7C4DDB', '#0EA5A5', '#E58A2F']], ['Sunset', ['#2B1A10', '#D9822B', '#C93B3B', '#4457D6']], ['Slate', ['#1B2430', '#4A6785', '#2E8B7A', '#C58A3A']]];
const FLAGS = [['dash', 'Can see the dashboard'], ['reports', 'Can see the reports'], ['del', 'Can delete records'], ['scope', 'Sees only their own department'], ['notify', 'Gets task alert emails']];
async function loadSettings(quiet) {
  try { S.cfg = await api('getAdminSettings'); if (S.cur === 'settings') renderSettings(); } catch (e) { if (!quiet) toast('Could not load settings', 1); }
}
function syncBoot() {                          // push saved general settings into the running app
  const v = {}; S.cfg.fields.forEach(f => { v[f.k] = f.v; });
  S.boot.s.church = v.church; S.boot.s.launch = v.launch; S.boot.s.date = v.date; S.boot.s.emoji = v.appEmoji || '⛪'; S.boot.s.theme = S.cfg.theme; EMOJI = S.boot.s.emoji;
  $('#sub').textContent = v.launch; pill();
}
function renderSettings() {
  const c = S.cfg;
  let h = `<div class="bar" style="--c:var(--before)"><h2 style="--c:var(--before)"><i></i>Settings</h2><button class="icon" id="rf" aria-label="Refresh">↻</button></div>
    <div class="seg s4">${[['general', 'General'], ['look', 'Colours'], ['roles', 'Roles'], ['lists', 'Lists']].map(x => `<button data-ss="${x[0]}" class="${S.sset === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>`;
  if (!c) h += '<div class="tile sk" style="min-height:220px"></div>';
  else h += S.sset === 'general' ? setGeneral(c) : S.sset === 'look' ? setLook(c) : S.sset === 'roles' ? setRoles(c) : setLists(c);
  $('#main').innerHTML = h;
  $('#rf').onclick = () => loadSettings();
  document.querySelectorAll('[data-ss]').forEach(b => b.onclick = () => { S.sset = b.dataset.ss; renderSettings(); });
  if (c) ({general: bindGeneral, look: bindLook, roles: bindRoles, lists: bindLists})[S.sset]();
}
// ----- general
function setGeneral(c) {
  const fld = f => `<div class="${(f.t === 'text' || f.t === 'url') && f.k !== 'appEmoji' ? 'wide' : ''}"><label>${esc(f.l)}</label>` +
    (f.t === 'yn' ? `<select name="${f.k}"><option>Yes</option><option>No</option></select>` : `<input name="${f.k}" type="${f.t === 'num' ? 'number' : f.t === 'text' ? 'text' : f.t}" ${f.t === 'num' ? 'inputmode="numeric" min="0"' : ''} autocomplete="off">`) + '</div>';
  return `<form id="gf" class="box" novalidate><b>General settings</b><p class="hint" style="margin:2px 0 12px">These apply to everyone: the dashboard, the forms and the emails.</p><div class="db" style="padding:0;overflow:visible">${c.fields.map(fld).join('')}</div><button class="btn" style="width:100%;margin-top:16px" type="submit">Save settings</button></form>`;
}
function bindGeneral() {
  const f = $('#gf'); S.cfg.fields.forEach(x => { f.elements[x.k].value = x.v; });
  f.onsubmit = async e => {
    e.preventDefault(); const vals = {}; S.cfg.fields.forEach(x => { vals[x.k] = f.elements[x.k].value; });
    const b = f.querySelector('[type=submit]'); b.disabled = true;
    try { S.cfg = await api('saveSettings', vals); syncBoot(); toast('Settings saved'); renderSettings(); } catch (er) { b.disabled = false; toast(errText(er), 1); }
  };
}
// ----- colours
function setLook(c) {
  const t = S.draft || (S.draft = Object.assign({}, c.theme)), lab = [['navy', 'Header & brand'], ['before', 'Before the launch'], ['during', 'During the launch'], ['after', 'After the launch']];
  return `<div class="box"><b>Pick a ready-made look</b><div class="presets">${PRESETS.map((p, i) => `<button type="button" class="preset" data-p="${i}">${p[1].map(x => `<span style="background:${x}"></span>`).join('')}<em>${p[0]}</em></button>`).join('')}</div></div>
    <div class="box"><b>Or choose your own colours</b><div class="cols">${lab.map(l => `<label class="colr"><input type="color" data-col="${l[0]}" value="${t[l[0]]}"><span>${l[1]}<small>${t[l[0]]}</small></span></label>`).join('')}</div>
    <p class="hint">Colours apply to everyone: the app, the public forms and the emails. You see changes instantly, and they are saved for everyone when you tap Save.</p>
    <div class="df" style="padding:0;border:0"><button class="btn ghost" id="tr" type="button">Reset to default</button><button class="btn" id="ts" type="button">Save colours</button></div></div>`;
}
function bindLook() {
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const p = PRESETS[+b.dataset.p][1]; S.draft = {navy: p[0], before: p[1], during: p[2], after: p[3]}; applyTheme(S.draft); renderSettings(); });
  document.querySelectorAll('[data-col]').forEach(i => i.oninput = () => { S.draft[i.dataset.col] = i.value; applyTheme(S.draft); i.nextElementSibling.querySelector('small').textContent = i.value; });
  $('#tr').onclick = () => { S.draft = Object.assign({}, DEF_THEME); applyTheme(S.draft); renderSettings(); };
  $('#ts').onclick = async () => {
    if (lum(S.draft.navy) > 0.6) return toast('Pick a darker header colour so the white text stays readable', 1);
    if (['before', 'during', 'after'].some(k => lum(S.draft[k]) > 0.85)) return toast('One of the colours is too light. Pick a stronger colour', 1);
    try { S.cfg = await api('saveSettings', {theme: S.draft}); S.boot.s.theme = S.cfg.theme; S.draft = null; applyTheme(S.cfg.theme); toast('Colours saved for everyone'); renderSettings(); } catch (e) { toast(errText(e), 1); }
  };
}
// ----- roles & permissions
function roleSummary(r) {
  if (r.all) return '<span class="badge good" style="display:inline-block;margin-top:8px">Full access</span>';
  const ed = S.cfg.modules.filter(m => r.access[m.key] === 'edit').length, vw = S.cfg.modules.filter(m => r.access[m.key] === 'view').length;
  return `<div class="meta"><span><i>Can edit</i>${ed} tabs</span><span><i>View only</i>${vw} tabs</span></div><div class="chipset">${FLAGS.filter(f => r[f[0]]).map(f => `<span class="badge">${esc(f[1].replace('Sees only their own department', 'Own department only').replace(/^(Can see the |Can |Gets )/, ''))}</span>`).join('')}</div>`;
}
function setRoles(c) {
  return `<div class="bar"><div style="flex:1"><b>Roles & permissions</b><div class="hint" style="margin:0">Decide what each role can see and do. Tap a role to change it.</div></div><button class="btn" id="nr" style="flex:none;min-height:44px;padding:0 16px">+ New role</button></div>
    <div class="sgrid">${c.roles.map(r => `<button class="card" data-role="${esc(r.name)}"><div class="r1"><b>${esc(r.name)}</b><span class="badge">${r.users} user${r.users === 1 ? '' : 's'}</span></div><div class="hint" style="margin:4px 0 0">${esc(r.info)}</div>${roleSummary(r)}</button>`).join('')}</div>
    <p class="hint">To give or take a right from <b>one person</b> only, open them on the Team & emails page and use “Custom access”.</p>`;
}
function bindRoles() {
  $('#nr').onclick = () => openRole();
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => openRole(b.dataset.role));
}
function openRole(name) {
  const c = S.cfg, dlg = $('#dlg'), r = name ? c.roles.find(x => x.name === name) : null, isNew = !r, locked = r && r.all;
  dlg.style.setProperty('--c', 'var(--before)');
  const SELV = k => `<select data-acc="${k}" ${locked ? 'disabled' : ''}><option value="">No access</option><option value="view">View only</option><option value="edit">Can edit</option></select>`;
  dlg.innerHTML = `<form novalidate><div class="dh"><b>${isNew ? 'New role' : esc(name)}</b><button type="button" class="icon" id="x" aria-label="Close">✕</button></div><div class="db">
    <div class="wide"><label>Role name <em>*</em></label><input name="name" type="text" autocomplete="off" ${isNew ? '' : 'disabled'}></div>
    <div class="wide"><label>What this role is for</label><input name="info" type="text" autocomplete="off" ${locked ? 'disabled' : ''}></div>
    ${isNew ? `<div class="wide"><label>Start from an existing role</label><select id="cp"><option value="">Blank (no access)</option>${c.roles.filter(x => !x.all).map(x => `<option>${esc(x.name)}</option>`).join('')}</select></div>` : ''}
    ${locked ? '<div class="wide hint" style="margin:0">The Admin role always has full access to everything and cannot be changed. This protects you from locking yourself out.</div>' : ''}
    <div class="wide"><div class="mxh" style="margin-top:0">Abilities</div><div class="mx">${FLAGS.map(f => `<div class="mxr"><span>${f[1]}</span><select data-flag="${f[0]}" ${locked ? 'disabled' : ''}><option value="no">No</option><option value="yes">Yes</option></select></div>`).join('')}</div></div>
    <div class="wide"><div class="mxh" style="margin-top:0">Access to each tab</div><div class="mx">${['Before', 'During', 'After'].map(p => `<div class="mxh">${p} the launch</div>` + c.modules.filter(m => m.phase === p).map(m => `<div class="mxr"><span>${m.icon} ${esc(m.title)}</span>${SELV(m.key)}</div>`).join('')).join('')}</div></div></div>
    <div class="df">${isNew || locked ? '' : '<button type="button" class="btn del" id="rdel">Delete role</button>'}${locked ? '<button type="button" class="btn ghost" id="x2" style="flex:1">Close</button>' : '<button type="submit" class="btn">Save role</button>'}</div></form>`;
  const f = dlg.querySelector('form');
  const fill = x => {
    f.elements.info.value = x ? x.info : '';
    FLAGS.forEach(fl => { f.querySelector(`[data-flag="${fl[0]}"]`).value = x && (x.all ? fl[0] !== 'scope' : x[fl[0]]) ? 'yes' : 'no'; });
    f.querySelectorAll('[data-acc]').forEach(e => { e.value = x ? (x.all ? 'edit' : x.access[e.dataset.acc] || '') : ''; });
  };
  f.elements.name.value = r ? r.name : ''; fill(r);
  if (isNew) $('#cp').onchange = e => fill(c.roles.find(x => x.name === e.target.value));
  $('#x').onclick = () => dlg.close(); if ($('#x2')) $('#x2').onclick = () => dlg.close();
  if ($('#rdel')) $('#rdel').onclick = async () => {
    if (!confirm('Delete the role "' + name + '"?')) return;
    try { S.cfg = await api('deleteRole', name); dlg.close(); toast('Role deleted'); renderSettings(); } catch (e) { toast(errText(e), 1); }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const role = {isNew: isNew, name: f.elements.name.value.trim(), info: f.elements.info.value.trim(), access: {}};
    FLAGS.forEach(fl => { role[fl[0]] = f.querySelector(`[data-flag="${fl[0]}"]`).value === 'yes'; });
    f.querySelectorAll('[data-acc]').forEach(x => { if (x.value) role.access[x.dataset.acc] = x.value; });
    if (role.name.length < 2) return toast('Give the role a name', 1);
    const b = f.querySelector('[type=submit]'); b.disabled = true;
    try { S.cfg = await api('saveRole', role); dlg.close(); toast('Role saved. It applies to everyone with this role'); renderSettings(); } catch (er) { b.disabled = false; toast(errText(er), 1); }
  };
  dlg.showModal();
}
// ----- dropdown lists
function setLists(c) {
  const cur = c.lists.find(l => l.key === S.listKey) || c.lists[0]; S.listKey = cur.key;
  return `<div class="box"><b>Dropdown lists</b><p class="hint" style="margin:2px 0 12px">Edit the choices people see in forms, for example departments, services or payment methods. One choice per line.</p>
    <label>List</label><select id="lk">${c.lists.map(l => `<option value="${l.key}" ${l.key === cur.key ? 'selected' : ''}>${esc(l.label)}</option>`).join('')}</select>
    <label style="margin-top:12px">Choices</label><textarea id="lt" rows="10" style="min-height:220px"></textarea>
    <button class="btn" id="ls" style="width:100%;margin-top:14px" type="button">Save list</button></div>`;
}
function bindLists() {
  const c = S.cfg, fill = () => { $('#lt').value = c.lists.find(l => l.key === S.listKey).items.join('\n'); };
  fill();
  $('#lk').onchange = e => { S.listKey = e.target.value; fill(); };
  $('#ls').onclick = async () => {
    const items = $('#lt').value.split('\n').map(x => x.trim()).filter(Boolean);
    try { S.cfg = await api('saveList', S.listKey, items); S.boot.lists[S.listKey] = S.cfg.lists.find(l => l.key === S.listKey).items; toast('List saved'); renderSettings(); } catch (e) { toast(errText(e), 1); }
  };
}

/* ---------- start ---------- */
function pill() {
  const d = Math.round((new Date(S.boot.s.date + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 864e5), p = $('#pill');
  p.hidden = isNaN(d); p.textContent = d > 1 ? d + ' days to launch' : d === 1 ? 'Launch is tomorrow' : d === 0 ? 'Launch day!' : 'Launched';
}
async function start() {
  if (!APP.inGas && !APP.backendUrl) return showSetup();
  if (!TOKEN) { await loadPublic(); return showLogin(); }
  $('#main').innerHTML = '<div class="tiles">' + '<div class="tile sk"></div>'.repeat(6) + '</div>';
  try {
    S.boot = await api('getBootstrap'); S.perms = S.boot.perms; S.user = S.boot.user;
    applyTheme(S.boot.s.theme); EMOJI = S.boot.s.emoji || '⛪';
    document.body.classList.remove('auth');
    const me = $('#me'); me.hidden = false; me.textContent = initials(S.user.name);
    history.replaceState({k: 'home'}, '');
    pill(); go('home', false);
  } catch (e) {
    if (/AUTH_REQUIRED|PW_CHANGE/.test(e && e.message)) return;
    $('#main').innerHTML = '<div class="empty">Could not start the app.<br>' + esc(errText(e)) + '<br><br><button class="btn" style="padding:0 24px" onclick="location.reload()">Try again</button></div>';
  }
}
start();
setInterval(() => { if (!S.boot || document.hidden || $('#dlg').open) return; refresh(true); }, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.boot && !$('#dlg').open) refresh(true); });
</script>
</body>
</html>
